name: Wake Streamlit dashboard

on:
  schedule:
    # Every 8 hours, offset from the top of the hour to reduce GitHub Actions delays.
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open dashboard and wake it if needed
        env:
          STREAMLIT_URL: https://dengue-surveillance.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import re
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000})

              print(f"Opening {url}")
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(5_000)

              wake_button = page.get_by_role(
                  "button",
                  name=re.compile(r"get this app back up|wake.*app", re.I),
              )

              if wake_button.count() > 0 and wake_button.first.is_visible():
                  print("Sleeping page detected. Clicking the wake-up button...")
                  wake_button.first.click()
                  page.wait_for_timeout(20_000)
                  print("Wake-up request sent.")
              else:
                  print("Dashboard is already awake (or no wake button was shown).")
                  # Keep a real browser session open briefly so the app has time to establish its connection.
                  page.wait_for_timeout(10_000)

              print(f"Final page title: {page.title()}")
              browser.close()
          PY
